    lang: en
  - locator: "ii 37"
    text: "On my third campaign, I marched to the land Ḫatti."
    lang: en
  - locator: "iii 18–27a"
    text: "Moreover, (as for) Hezekiah of the land Judah, who had not submitted to my yoke, I surrounded (and) conquered forty-six of his fortified cities, fortresses, and small(er) settlements in their environs, which were without number, by having ramps trodden down and battering rams brought up, the assault of foot soldiers, sapping, breaching, and siege engines. I brought out of them 200,150 people, young (and) old, male and female, horses, mules, donkeys, camels, oxen, and sheep and goats, which were without number, and I counted (them) as booty."
    lang: en
  - locator: "iii 27b–34"
    text: "As for him (Hezekiah), I confined him inside the city Jerusalem, his royal city, like a bird in a cage. I set up blockades against him and made him dread exiting his city gate. I detached from his land the cities of his that I had plundered and I gave (them) to Mitinti, the king of the city Ashdod, Padî, the king of the city Ekron, and Ṣilli-Bēl, the king of the city Gaza, and (thereby) made his land smaller."
    lang: en
  - locator: "iii 16"
    text: "ù mḫa-za-qi-a-ú KUR.ia-ú-da-a-a ša la ik-nu-šú"
    lang: akk
