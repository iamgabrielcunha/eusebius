label: {en: "Reformed tradition", pt-BR: "Tradição Reformada"}
summary:
  en: "The branch of Protestantism shaped by Zwingli, Bullinger and Calvin and codified in the Reformed confessions (Heidelberg Catechism, Belgic Confession, Westminster Standards, 1689 Baptist Confession). Marked by covenant theology, the sovereignty of God in salvation, and a forensic doctrine of justification."
  pt-BR: "O ramo do protestantismo moldado por Zuínglio, Bullinger e Calvino e codificado nas confissões reformadas (Catecismo de Heidelberg, Confissão Belga, Padrões de Westminster, Confissão Batista de 1689). Marcado pela teologia da aliança, pela soberania de Deus na salvação e por uma doutrina forense da justificação."
