summary:
  en: "The first of the Latter Prophets; sixty-six chapters ranging from the Assyrian crisis of the eighth century to the return from exile. Its composition date is a disputed claim with named positions, kept separate from the dates of the events it narrates (D-012)."
  pt-BR: "O primeiro dos Profetas Posteriores; sessenta e seis capítulos que vão da crise assíria do século VIII ao retorno do exílio. Sua data de composição é uma afirmação disputada com posições nomeadas, mantida separada das datas dos eventos narrados (D-012)."
