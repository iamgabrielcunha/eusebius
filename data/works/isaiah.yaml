    why_uncertain:
      en: "The traditional position: the whole book is the work of Isaiah ben Amoz, active c. 740–700 BC, with chapters 40–66 as predictive prophecy. Held by conservative interpreters across traditions; a minority among critical scholars. No source has yet been fetched."
    notes:
      en: "Competing position: see composition-multiple-authors."
  - id: composition-multiple-authors
    kind: date
    property: composition
    model: {ref: model/b-conventional-historical}
    value: {method: range, earliest: -740, latest: -500}
    precision: century
    confidence: medium
    basis: scholarly_consensus
    status: ai_suggested
    evidence: []
    why_uncertain:
      en: "The critical consensus since Duhm (1892): First Isaiah (1–39) largely eighth century; Second Isaiah (40–55) in the Babylonian exile c. 550–539 BC; Third Isaiah (56–66) post-exilic. Extent of later editing within 1–39 is debated. No source has yet been fetched."
    notes:
      en: "Competing position: see composition-unified-8c."
